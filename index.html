<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Money Tracker home-screen launcher. PUBLIC page (GitHub Pages): holds no data, no URL, no key.
     The app's deployment id and key come after "#" in the home-screen link (never sent to any server). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Money">
<meta name="theme-color" content="#1B1630">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
<title>Money</title>
<style>
  html, body { margin: 0; height: 100%; background: #1B1630; overflow: hidden; }
  /* The frame fills the page. Status bar style is "black" (not see-through): with the see-through
     style iOS 26+ moves the home-screen app up under the clock and leaves the bottom 62pt empty. */
  iframe { display: block; position: fixed; left: 0; top: 0; width: 100%; height: 100%; border: 0; background: #1B1630; }
  #probe { position: fixed; top: 0; left: 0; width: 1px; visibility: hidden; pointer-events: none;
           padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  #msg { display: none; height: 100%; align-items: center; justify-content: center; text-align: center;
         color: #B9B0D9; font: 15px/1.5 -apple-system, system-ui, sans-serif; padding: 24px; box-sizing: border-box; }
</style>
</head>
<body>
<div id="probe"></div>
<div id="msg">Open Money Tracker from your home-screen link.</div>
<script>
(function () {
  var KEY = 'mt_launch';
  // Never run inside another website's frame.
  if (window.top !== window.self) { document.getElementById('msg').style.display = 'flex'; return; }
  var h = location.hash.slice(1);
  var d = (/(?:^|&)d=([A-Za-z0-9_-]{20,120})(?:&|$)/.exec(h) || [])[1];
  var k = (/(?:^|&)k=([0-9a-f]{64})(?:&|$)/.exec(h) || [])[1];
  try {
    if (d && k) localStorage.setItem(KEY, JSON.stringify({ d: d, k: k }));
    else { var s = JSON.parse(localStorage.getItem(KEY) || 'null'); if (s) { d = s.d; k = s.k; } }
  } catch (e) {}
  if (!d || !k || !/^[A-Za-z0-9_-]+$/.test(d) || !/^[0-9a-f]{64}$/.test(k)) {
    document.getElementById('msg').style.display = 'flex';
    return;
  }
  var f = document.createElement('iframe');
  f.title = 'Money Tracker';
  f.referrerPolicy = 'no-referrer';
  // A frame can't see the clock-bar / home-bar sizes, so pass them along (plain numbers only).
  var p = document.getElementById('probe'), cs = getComputedStyle(p);
  var st = Math.round(parseFloat(cs.paddingTop) || 0), sb = Math.round(parseFloat(cs.paddingBottom) || 0);
  // iOS home-screen app with the "black" status bar: the page starts BELOW the clock bar but iOS still
  // reports the full screen height, so the bottom part hangs off the screen. Use only what is visible.
  var cut = 0;
  if (navigator.standalone) {
    var tall = Math.max(screen.width, screen.height);
    if (!st && window.innerHeight >= tall - 1) cut = tall >= 874 ? 62 : 59;  // clock bar height
    if (!sb && tall >= 812) sb = 34;  // Face ID iPhones have a home bar; iOS sometimes says 0
  }
  document.body.appendChild(f);
  // Size by the real window height ("100%" can be wrong in home-screen apps).
  function fit() { f.style.height = (window.innerHeight - cut) + 'px'; }
  fit();
  f.src = 'https://script.google.com/macros/s/' + d + '/exec#k=' + k + '&st=' + st + '&sb=' + sb;
  window.addEventListener('resize', fit);
  window.addEventListener('orientationchange', function () { setTimeout(fit, 300); });
})();
</script>
</body>
</html>
